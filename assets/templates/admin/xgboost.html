{% extends 'adminbase.html' %}
{% block title %}XGBoost - SearchLens{% endblock %}
{% block contents %}
<div class="sl-wrap sl-auth-wrap">
  <div class="sl-auth">
    <div class="sl-auth-ic">&#128640;</div>
    <h1>XGBoost accuracy</h1>
    <p class="sl-sub">Gradient-boosting classifier on the indexed documents.</p>
    <div class="sl-big">{{ accuracy|floatformat:2 }}%</div>
    <div class="sl-meter" data-value="{{ accuracy|stringformat:'.2f' }}"><i></i></div>
  </div>
</div>
{% endblock %}
