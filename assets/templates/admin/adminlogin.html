{% extends 'sl_base.html' %}
{% block title %}Admin sign in - SearchLens{% endblock %}
{% block contents %}
<div class="sl-wrap sl-auth-wrap">
  <div class="sl-auth">
    <div class="sl-auth-ic">&#128737;</div>
    <h1>Admin sign in</h1>
    <p class="sl-sub">Approve accounts and review the models.</p>
    {% if messages %}{% for message in messages %}<div class="sl-alert">{{ message }}</div>{% endfor %}{% endif %}
    <form class="sl-form" method="post" action="{% url 'adminloginentered' %}">
      {% csrf_token %}
      <label>Username<input type="text" name="uname" placeholder="Admin username" required autofocus></label>
      <label>Password<input type="password" name="upasswd" placeholder="Password" required></label>
      <button class="sl-btn sl-block" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
