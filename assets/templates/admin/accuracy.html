{% extends 'adminbase.html' %}
{% block title %}SVM - SearchLens{% endblock %}
{% block contents %}
<div class="sl-wrap" style="padding-bottom:80px">
  <div class="sl-resbar"><h2 class="sl-h2" style="margin:20px 0 0">SVM model</h2></div>
  <p class="sl-sub" style="margin:6px 0 20px">Linear-kernel Support Vector Machine trained on the indexed documents.</p>
  <div class="sl-panel"><h3>Classification report</h3><pre class="sl-pre">{{ accurancy }}</pre></div>
  <div class="sl-panel"><h3>Confusion matrix</h3><pre class="sl-pre">{{ m }}</pre></div>
</div>
{% endblock %}
