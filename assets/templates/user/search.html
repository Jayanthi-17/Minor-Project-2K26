{% extends 'sl_base.html' %}
{% block title %}Search - SearchLens{% endblock %}
{% block contents %}
<div class="sl-wrap">
  <section class="sl-hero" style="padding-top:70px">
    <h1>Search <span class="sl-grad">anything</span></h1>
    <p>Enter a keyword to find matching documents.</p>
    <form class="sl-search" method="get" action="{% url 'usersearchresult1' %}">
      <span>&#128269;</span>
      <input type="text" name="filename" placeholder="Search documents..." autocomplete="off" required autofocus>
      <span class="sl-kbd">/</span>
      <button class="sl-btn" type="submit">Search</button>
    </form>
    <div class="sl-chips" id="sl-recent" data-url="{% url 'usersearchresult1' %}"></div>
  </section>
</div>
{% endblock %}
